name: Validate

on:
  push:
    branches: [main]
  pull_request:
  # Agent 用默认 token 建的 PR 不会触发 pull_request，由 Agent Implement 手动补触发。
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.13"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: |
          # requirements-cutout.txt 包含 requirements.txt，另加抠图用的 numpy / OpenCV，
          # 这样渲染和抠图两条路径的冒烟测试都会真正运行。
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -r requirements-cutout.txt

      - name: Validate repository
        run: python tools/validate_repo.py

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Check CLI
        run: |
          python scripts/render_cover.py --help
          python scripts/render_examples.py --help
          python scripts/extract_cutout.py --help

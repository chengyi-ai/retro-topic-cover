name: 功能建议 / Feature request
description: 新的排版参数、拼贴能力、抠图改进或体验改进
labels: ["needs-triage", "source:github", "type:feature"]
body:
  - type: markdown
    attributes:
      value: 提交后 Agent 会自动评估可行性。注意本项目的红线：不使用 AI 生图或生成式填充；只用公有领域或兼容授权的真实素材，并记录来源与许可；前景人物不从背景复制；不需要 API Key。
  - type: textarea
    id: problem
    attributes:
      label: 想解决什么问题
      description: 你在做哪类选题（人物、历史、影视文化……）、哪一步时遇到了什么不便。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 期望的做法
      description: 理想中的参数、拼贴 JSON 字段或成图效果，可附参考图（自己的图或开放授权的图）。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 目前的替代办法
